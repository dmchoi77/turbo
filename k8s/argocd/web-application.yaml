apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: turbo-web-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dmchoi77/turbo.git
    targetRevision: main
    path: k8s/local
  destination:
    server: https://kubernetes.default.svc
    namespace: turbo-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
